name: Charok Android
on:
  push:
    branches: [feat/charok-recorder]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: charok-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --console=plain
      - name: Enable KVM for a new disposable general Android AVD
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: General Android TEST flow (not Pleos)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_c
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: bash scripts/ci_device.sh
      - name: Capture evidence even on a failed device test
        if: always()
        run: |
          mkdir -p artifacts
          adb -s emulator-5554 pull /sdcard/Android/data/dev.leemh.charok/files/evidence artifacts/device-after || true
      - name: APK hashes and signature metadata
        if: always()
        run: python3 scripts/apk_metadata.py --output artifacts/apk-metadata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charok-apks-and-evidence
          path: |
            artifacts/
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
          retention-days: 14
